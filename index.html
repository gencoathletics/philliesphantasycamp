<!DOCTYPE html>

  <style>
    body {

      transition: 0.2s;
      cursor: pointer;
    }

    .nav-card:hover {
      border-color: #b30000;
      color: #b30000;
      transform: translateY(-3px);
    }

    a {
      text-decoration: none;
      color: inherit;
