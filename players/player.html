<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Player Profile</title>

    <!-- DataTables + jQuery -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>

    <!-- PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <!-- Player JS -->
    <script src="../js/player.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            margin-bottom: 5px;
        }

        h2 {
            margin-top: 40px;
            margin-bottom: 10px;
        }

        table.dataTable {
            width: 100% !important;
            margin-bottom: 40px;
        }

        .section {
            margin-top: 40px;
        }
    </style>
</head>

<body onload="loadPlayerPage()">

    <!-- Player Name Header -->
    <h1 id="playerName">Loading...</h1>

    <!-- Season Hitting -->
    <div class="section">
        <h2>Season Hitting</h2>
        <table id="playerHitting" class="display">
            <thead>
                <tr>
                    <th>Season</th>
                    <th>AB</th>
                    <th>H</th>
                    <th>R</th>
                    <th>RBI</th>
                    <th>2B</th>
                    <th>3B</th>
                    <th>HR</th>
                    <th>AVG</th>
                </tr>
            </thead>
        </table>
    </div>

    <!-- Season Pitching -->
    <div class="section">
        <h2>Season Pitching</h2>
        <table id="playerPitching" class="display">
            <thead>
                <tr>
                    <th>Season</th>
                    <th>IP</th>
                    <th>K</th>
                    <th>W</th>
                    <th>S</th>
                    <th>BB</th>
                    <th>R</th>
                    <th>H</th>
                    <th>ERA</th>
                    <th>WHIP</th>
                </tr>
            </thead>
        </table>
    </div>

    <!-- Career Hitting -->
    <div class="section">
        <h2>Career Hitting</h2>
        <table id="playerCareerHitting" class="display">
            <thead>
                <tr>
                    <th>AB</th>
                    <th>H</th>
                    <th>R</th>
                    <th>RBI</th>
                    <th>2B</th>
                    <th>3B</th>
                    <th>HR</th>
                    <th>AVG</th>
                </tr>
            </thead>
        </table>
    </div>

    <!-- Career Pitching -->
    <div class="section">
        <h2>Career Pitching</h2>
        <table id="playerCareerPitching" class="display">
            <thead>
                <tr>
                    <th>IP</th>
                    <th>K</th>
                    <th>W</th>
                    <th>S</th>
                    <th>BB</th>
                    <th>R</th>
                    <th>H</th>
                    <th>ERA</th>
                    <th>WHIP</th>
                </tr>
            </thead>
        </table>
    </div>

</body>
</html>
